[build]
  base    = "src/client"
  command = "npm install && npm run build"
  publish = "dist"

# Proxy all /api/* requests to the backend so the frontend never hard-codes
# the backend URL. Replace the `to` URL once you deploy the backend on Render.
[[redirects]]
  from   = "/api/*"
  to     = "https://battleship-api.onrender.com/api/:splat"
  status = 200
  force  = true
